name: Agendamento de Boleto
on:
  schedule:
    - cron: '0 9 5 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
      - name: Instalar Dependências
        run: |
          pip install playwright requests
          playwright install chromium
      - name: Executar Robô
        env:
          CONAC_CPF: ${{ secrets.CONAC_CPF }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python conac_robot.py
        
      - name: Manter Repositório Ativo
        run: |
          date > ultimo_disparo.txt
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add ultimo_disparo.txt
          git commit -m "Auto-update: Mantendo fluxo ativo" || exit 0
          git push
