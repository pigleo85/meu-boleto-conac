name: Agendamento de Boleto
on:
  schedule:
    - cron: '0 9 5 * *' # Roda todo dia 05 às 06:00 AM (Brasília)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Navegador
        run: |
          pip install playwright
          playwright install chromium
      - name: Executar Robô
        env:
          CONAC_EMAIL: ${{ secrets.CONAC_EMAIL }}
        run: python conac_robot.py
        
      - name: Manter Repositório Ativo
        run: |
          date > ultimo_disparo.txt
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add ultimo_disparo.txt
          git commit -m "Auto-update: Mantendo fluxo ativo" || exit 0
          git push
